version: '3.8'

services:
  server:
    build: ./server
    container_name: chat-server
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - ADMIN_SECRET=admin123
    volumes:
      - ./server/uploads:/app/uploads
      - ./backups:/app/backups

  client:
    build: ./client
    container_name: chat-client
    ports:
      - "8090:80"
    depends_on:
      - server


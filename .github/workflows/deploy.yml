name: Node.js CloudPanel CD

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to CloudPanel VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            # Navigate to the website root directory
            cd /home/onurbayramov-chat/htdocs/${{ secrets.DOMAIN_NAME }}
            
            # Add git safe directory exception to prevent dubious ownership fatal error
            git config --global --add safe.directory /home/onurbayramov-chat/htdocs/${{ secrets.DOMAIN_NAME }}

            # Pull latest changes from GitHub
            git pull origin main
            
            # Install Frontend dependencies and build
            cd client
            npm install
            npm run build
            
            # Install Backend dependencies
            cd ../server
            npm install
            
            # Create the systemd service file if it doesn't exist
            if [ ! -f /etc/systemd/system/chat-app.service ]; then
                echo "Creating systemd service file..."
                NODE_PATH=$(which node || echo "/usr/bin/node")
                sudo bash -c "cat <<EOF > /etc/systemd/system/chat-app.service
[Unit]
Description=Real-Time Chat App
After=network.target

[Service]
Type=simple
User=onurbayramov-chat
WorkingDirectory=/home/onurbayramov-chat/htdocs/chat.onurbayramov.codes
ExecStart=$NODE_PATH app.js
Restart=on-failure

[Install]
WantedBy=multi-user.target
EOF"
                sudo systemctl daemon-reload
                sudo systemctl enable chat-app
            fi

            # Restart the custom chat-app service
            echo "Restarting chat-app service..."
            sudo systemctl restart chat-app


name: Node.js CloudPanel CD

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to CloudPanel VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            # Navigate to the website root directory
            cd /home/onurbayramov-chat/htdocs/${{ secrets.DOMAIN_NAME }}
            
            # Add git safe directory exception to prevent dubious ownership fatal error
            git config --global --add safe.directory /home/onurbayramov-chat/htdocs/${{ secrets.DOMAIN_NAME }}

            # Pull latest changes from GitHub
            git pull origin main
            
            # Install Frontend dependencies and build
            cd client
            npm install
            npm run build
            
            # Install Backend dependencies
            cd ../server
            npm install
            
            # Diagnostic: List all systemd services to find the correct service name
            echo "=== SYSTEMD SERVICES ==="
            systemctl list-unit-files --all --type=service | grep -E "nodejs|chat|onur|clp" || true
            echo "=== SYSTEMD SYSTEM DIRECTORY ==="
            ls -la /etc/systemd/system/ | grep -E "nodejs|chat|onur|clp" || true
            
            # Find the correct systemd service name dynamically and restart it
            SERVICE_NAME=$(systemctl list-units --all --type=service | grep -oE "[a-zA-Z0-9\._-]*${{ secrets.DOMAIN_NAME }}[a-zA-Z0-9\._-]*" | head -n 1)
            if [ -z "$SERVICE_NAME" ]; then
                SERVICE_NAME=$(systemctl list-unit-files --all | grep -oE "[a-zA-Z0-9\._-]*${{ secrets.DOMAIN_NAME }}[a-zA-Z0-9\._-]*" | head -n 1)
            fi
            
            # Fallback search if exact domain matches fail
            if [ -z "$SERVICE_NAME" ]; then
                SERVICE_NAME=$(systemctl list-unit-files --all | grep -E "nodejs|chat|onur" | grep -v "\.path" | awk '{print $1}' | head -n 1)
            fi
            
            if [ ! -z "$SERVICE_NAME" ]; then
                echo "Restarting service: $SERVICE_NAME"
                sudo systemctl restart $SERVICE_NAME
            else
                echo "Error: Systemd service not found."
                exit 1
            fi




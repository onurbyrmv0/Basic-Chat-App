name: Node.js CloudPanel CD

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to CloudPanel VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            # Navigate to the website root directory
            cd /home/onurbayramov-chat/htdocs/${{ secrets.DOMAIN_NAME }}
            
            # Pull latest changes from GitHub
            git pull origin main
            
            # Install Frontend dependencies and build
            cd client
            npm install
            npm run build
            
            # Install Backend dependencies
            cd ../server
            npm install
            
            # Restart the Node.js application in CloudPanel
            # (Note: Requires SSH user to have clpctl permissions or run as root/sudo)
            sudo clpctl site:restart --domain=${{ secrets.DOMAIN_NAME }}

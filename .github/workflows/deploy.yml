name: Node.js CloudPanel CD

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to CloudPanel VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            # Navigate to the website root directory
            cd /home/onurbayramov-chat/htdocs/${{ secrets.DOMAIN_NAME }}
            
            # Add git safe directory exception to prevent dubious ownership fatal error
            git config --global --add safe.directory /home/onurbayramov-chat/htdocs/${{ secrets.DOMAIN_NAME }}

            # Pull latest changes from GitHub
            git pull origin main
            
            # Install Frontend dependencies and build
            cd client
            npm install
            npm run build
            
            # Install Backend dependencies
            cd ../server
            npm install
            
            # Diagnostic: List user-level systemd services
            echo "=== SYSTEMD USER SERVICES ==="
            systemctl --user list-units --all --type=service || true
            
            # Restart the user-level nodejs service managed by CloudPanel (no sudo required)
            echo "Restarting Node.js application..."
            systemctl --user restart nodejs || systemctl --user restart nodejs.service
